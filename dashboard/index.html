<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Task Board</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    :root {
      --bg: #0b1020;
      --panel: #121a2b;
      --panel-2: #17223a;
      --line: #26324a;
      --text: #e5ecff;
      --muted: #93a0bd;
      --accent: #60a5fa;
      --done: #22c55e;
      --danger: #f87171;
    }
    * { box-sizing: border-box; }
    body {
      margin:0;
      font-family: Inter, system-ui, sans-serif;
      color:var(--text);
      background: radial-gradient(1400px 800px at 15% -10%, #1e3a6e 0%, var(--bg) 60%);
    }
    .wrap { max-width: 1400px; margin: 22px auto; padding: 0 16px; }
    .header { display:flex; justify-content:space-between; gap:14px; align-items:end; margin-bottom:12px; }
    h1 { margin:0; font-size:1.6rem; font-weight:700; letter-spacing:-.02em; }
    .sub { color: #b4c0dc; font-size:.85rem; }

    .toolbar { display:flex; gap:10px; align-items:center; margin-bottom:12px; flex-wrap:wrap; }
    input, select, button, textarea { border:1px solid var(--line); background:#0f1729; color:var(--text); border-radius:10px; padding:10px 12px; transition:border-color .2s, box-shadow .2s, transform .2s; }
    input:focus, select:focus, textarea:focus { outline:none; border-color:#3b82f6; box-shadow:0 0 0 3px rgba(59,130,246,.2); }
    textarea { resize: vertical; min-height: 90px; }
    .search { min-width:260px; }
    .btn-primary { background:linear-gradient(135deg,#2563eb,#1d4ed8); border-color:#1e40af; cursor:pointer; box-shadow:0 4px 14px rgba(37,99,235,.4); }
    .btn-primary:hover { filter:brightness(1.08); transform:translateY(-1px); }

    .board { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; }
    .col { background:rgba(17,26,46,.72); backdrop-filter: blur(12px); border:1px solid rgba(255,255,255,.07); border-radius:14px; min-height:420px; display:flex; flex-direction:column; transition: box-shadow .2s ease, transform .2s ease; overflow: visible; }
    .col[data-col="scheduled"] { border-top:3px solid #3b82f6; }
    .col[data-col="queue"] { border-top:3px solid #f59e0b; }
    .col[data-col="in_progress"] { border-top:3px solid #a78bfa; }
    .col[data-col="done"] { border-top:3px solid #22c55e; }
    .col.drag-over { box-shadow: 0 0 0 2px #60a5fa66 inset; transform: translateY(-2px); }
    .col-head { padding:10px 12px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; font-weight:600; }
    .count { color: var(--muted); font-size:.85rem; }
    .status-dot { width:10px; height:10px; border-radius:50%; display:inline-block; background:#22c55e; box-shadow:0 0 0 0 rgba(34,197,94,.7); animation:pulse 2s infinite; }
    @keyframes pulse { 0% { box-shadow:0 0 0 0 rgba(34,197,94,.7);} 70% { box-shadow:0 0 0 10px rgba(34,197,94,0);} 100% { box-shadow:0 0 0 0 rgba(34,197,94,0);} }
    .cards { padding:10px; display:grid; gap:10px; }

    .card { background:rgba(23,34,58,.85); border:1px solid rgba(255,255,255,.06); border-radius:12px; padding:10px; display:grid; gap:8px; cursor:grab; transition: transform .18s ease, opacity .18s ease, box-shadow .18s ease; box-shadow:0 2px 12px rgba(0,0,0,.4); }
    .card:hover { transform:translateY(-2px); box-shadow:0 8px 24px rgba(0,0,0,.5),0 0 0 1px rgba(96,165,250,.15); border-color:rgba(96,165,250,.25); }
    .card.dragging { opacity:.45; transform: scale(.97); }
    .card-title { font-weight:600; line-height:1.3; }
    .row { display:flex; justify-content:space-between; align-items:center; gap:8px; }
    .pill { font-size:.72rem; border-radius:999px; border:1px solid; padding:2px 8px; font-weight:500; }
    .agent { color:#93c5fd; border-color:rgba(96,165,250,.4); background:rgba(30,64,175,.3); }
    .user { color:#86efac; border-color:rgba(34,197,94,.4); background:rgba(20,83,45,.3); }
    .meta { font-size:.78rem; color:var(--muted); line-height:1.35; }
    .actions { display:flex; flex-wrap:wrap; gap:6px; }
    .actions button { padding:6px 8px; font-size:.78rem; border-radius:8px; cursor:pointer; }
    .btn-danger { background:#3b1b1b; border-color:#7f1d1d; color:#fecaca; }
    .due { font-size:.78rem; color:#cbd5e1; }
    .dropzone { border:1px dashed #3b82f6; border-radius:10px; padding:10px; color:var(--muted); font-size:.85rem; text-align:center; }
    .dropzone.drag { background:#1e293b; border-color:#60a5fa; }
    .image-drop { border:1px dashed #4f7fff; border-radius:12px; padding:14px; text-align:center; background:linear-gradient(180deg,#111b33,#0f1729); }
    .image-drop.drag { border-color:#79a6ff; box-shadow:0 0 0 2px #79a6ff33 inset; }
    .image-selector .image-preview-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
    .image-selector .image-preview-item { border:1px solid var(--line); border-radius:10px; overflow:hidden; background:#0f1729; }
    .image-selector .image-preview-link { display:block; width:100%; aspect-ratio:16/9; background:#0b1225; }
    .image-selector .image-preview-link img { width:100%; height:100%; object-fit:cover; display:block; }
    .image-selector .image-preview-actions { display:flex; align-items:center; justify-content:space-between; gap:8px; padding:8px; }

    .modal { position:fixed; inset:0; background:rgba(0,0,0,.6); backdrop-filter:blur(4px); display:none; align-items:center; justify-content:center; padding:16px; }
    .modal.open { display:flex; }
    .modal-card { width:min(560px,100%); background:rgba(13,19,36,.95); border:1px solid rgba(255,255,255,.06); border-radius:14px; padding:14px; backdrop-filter:blur(20px); box-shadow:0 24px 64px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.06); }
    .modal-grid { display:grid; gap:10px; grid-template-columns:1fr 1fr; }
    .modal-grid .full { grid-column:1/-1; }

    @media (max-width: 1100px) { .board { grid-template-columns:1fr 1fr; } }
    @media (max-width: 700px) {
      .board { grid-template-columns:1fr; }
      .search { min-width: 100%; }
      .modal-grid { grid-template-columns:1fr; }
      .modal { padding:0; align-items:flex-end; }
      .modal-card { width:100%; max-height:92vh; border-radius:16px 16px 0 0; overflow:auto; }
      .actions button { padding:10px 12px; font-size:.88rem; }
      .card { cursor:pointer; }
      .image-selector .image-preview-grid { grid-template-columns:1fr; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="./app.js"></script>
</body>
</html>
